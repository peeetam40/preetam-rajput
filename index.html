
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preetam Rajput</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    header {
      background: #123b70;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }
    header h1 { margin: 0 0 10px; }
    main {
      max-width: 650px;
      margin: 25px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 15px #00000012;
    }
    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    textarea { min-height: 110px; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: 0;
      border-radius: 8px;
      background: #168447;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Preetam Rajput</h1>
    <p>Welcome to our website</p>
  </header>

  <main>
    <div class="card">
      <h2>Contact Us</h2>
      <p>Fill in your details to send an enquiry.</p>

      <form id="contactForm">
        <label for="name">Your Name</label>
        <input id="name" required placeholder="Enter your name">

        <label for="contact">Your Phone or Email</label>
        <input id="contact" required placeholder="Enter contact details">

        <label for="message">Your Message</label>
        <textarea id="message" required placeholder="Write your enquiry"></textarea>

        <button type="submit">Send Enquiry on WhatsApp</button>
      </form>
    </div>
  </main>

  <footer>© Preetam Rajput</footer>

  <script>
    const WHATSAPP_NUMBER = "91XXXXXXXXXX";

    document.getElementById("contactForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const message = document.getElementById("message").value.trim();

      const text =
        "New enquiry for Preetam Rajput\n" +
        "Name: " + name + "\n" +
        "Contact: " + contact + "\n" +
        "Message: " + message;

      const whatsappURL =
        "https://wa.me/" + WHATSAPP_NUMBER +
        "?text=" + encodeURIComponent(text);

      window.location.href = whatsappURL;
    });
  </script>
</body>
</html>
